aid: zmanda
name: Zmanda
description: >-
  Zmanda is an enterprise backup and recovery software provider and the
  commercial steward of the open-source Amanda (Advanced Maryland Automatic
  Network Disk Archiver) project. Its products protect Linux, Windows and macOS
  systems, databases, and application data with agent-based and agentless
  backups that write to local disk, tape, and public-cloud object storage. The
  company maintains an active GitHub organization (github.com/zmanda) around the
  Amanda backup engine and related tooling, operates a customer-facing
  management portal at the Zmanda Network (network.zmanda.com), and publishes
  API documentation for programmatic backup and recovery management at
  api.zmanda.com. Zmanda was an early portfolio company of Canaan Partners.
